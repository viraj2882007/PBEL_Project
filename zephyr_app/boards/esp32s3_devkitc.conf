# NOTE: this file is read by Zephyr as a Kconfig fragment for the board of the same name.
# It previously contained C preprocessor syntax, which is a Kconfig parse error and
# breaks `west build` for matching boards. The values below are documentation only;
# real peripheral selection comes from each board's devicetree.

# Zephyr board configuration for ESP32-S3 DevKitC

# GPIO configuration
# GPIO_PORTS = "gpio0", "gpio1"

# ADC configuration
# ADC_CHANNELS = 20

# UART configuration - console on UART0
# CONSOLE_UART = "uart0"

# SPI configuration
# SPI_BUS = "spi2"

# I2C configuration
# I2C_BUS = "i2c0"

# PWM configuration
# PWM_DEV = "ledc0"

# Counter/TIMER
# TIMER_DEV = "timer0"

# Flash
# FLASH_DEV = "flash0"

# Entropy/RNG
# ENTROPY_DEV = "rng"

# USB
# USB_DEV = "usb_dc"

# WiFi
# WIFI_DEV = "wifi0"

# Bluetooth
# BT_DEV = "bt0"
