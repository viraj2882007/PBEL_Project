# NOTE: this file is read by Zephyr as a Kconfig fragment for the board of the same name.
# It previously contained C preprocessor syntax, which is a Kconfig parse error and
# breaks `west build` for matching boards. The values below are documentation only;
# real peripheral selection comes from each board's devicetree.

# Zephyr board configuration for Arduino Mega (ATmega2560)

# GPIO configuration
# GPIO_PORTS = "gpioa", "gpiob", "gpioc", "gpiod", "gpioe", "gpiof", "gpiog", "gpioh", "gpioj", "gpiok", "gpiol"

# ADC configuration
# ADC_CHANNELS = 16

# UART configuration - console on UART0 (PE0/PE1)
# CONSOLE_UART = "uart0"

# SPI configuration - SPI0
# SPI_BUS = "spi0"

# I2C configuration - I2C0
# I2C_BUS = "i2c0"

# PWM configuration
# PWM_DEV = "pwm0"

# Counter/TIMER
# TIMER_DEV = "timer0"

# Flash
# FLASH_DEV = "flash0"

# Entropy/RNG
# ENTROPY_DEV = "rng"
