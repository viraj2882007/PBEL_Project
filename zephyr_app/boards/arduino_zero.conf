# NOTE: this file is read by Zephyr as a Kconfig fragment for the board of the same name.
# It previously contained C preprocessor syntax, which is a Kconfig parse error and
# breaks `west build` for matching boards. The values below are documentation only;
# real peripheral selection comes from each board's devicetree.

# Zephyr board configuration for Arduino Zero (ATSAMD21G18)

# GPIO configuration
# GPIO_PORTS = "gpioa", "gpiob"

# ADC configuration
# ADC_CHANNELS = 14

# UART configuration - console on SERCOM0 (PA11/PA10)
# CONSOLE_UART = "uart0"

# SPI configuration - SERCOM1, SERCOM2, SERCOM3, SERCOM4, SERCOM5
# SPI_BUS = "spi0"

# I2C configuration - SERCOM0, SERCOM1, SERCOM2, SERCOM3, SERCOM4, SERCOM5
# I2C_BUS = "i2c0"

# PWM configuration - TCC0, TCC1, TCC2, TC3, TC4, TC5
# PWM_DEV = "pwm0"

# Counter/TIMER
# TIMER_DEV = "timer0"

# Flash
# FLASH_DEV = "flash0"

# Entropy/RNG
# ENTROPY_DEV = "rng"

# USB
# USB_DEV = "usb_dc"
