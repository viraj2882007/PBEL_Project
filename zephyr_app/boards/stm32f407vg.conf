# NOTE: this file is read by Zephyr as a Kconfig fragment for the board of the same name.
# It previously contained C preprocessor syntax, which is a Kconfig parse error and
# breaks `west build` for matching boards. The values below are documentation only;
# real peripheral selection comes from each board's devicetree.

# Zephyr board configuration for STM32F407VG (Nucleo-F407ZG / Discovery)

# GPIO configuration
# GPIO_PORTS = "gpioa", "gpiob", "gpioc", "gpiod", "gpioe", "gpiof", "gpiog"

# ADC configuration
# ADC_CHANNELS = 24

# UART configuration - console on USART3 (PB10/PB11)
# CONSOLE_UART = "usart3"

# SPI configuration - SPI1, SPI2, SPI3
# SPI_BUS = "spi1"

# I2C configuration - I2C1, I2C2, I2C3
# I2C_BUS = "i2c1"

# PWM configuration - TIM1, TIM3, TIM4, TIM5
# PWM_DEV = "pwm1"

# Counter/TIMER
# TIMER_DEV = "timer2"

# Flash
# FLASH_DEV = "flash0"

# Entropy/RNG
# ENTROPY_DEV = "rng"

# Ethernet
# ETH_DEV = "eth0"

# USB
# USB_DEV = "usb_dc"
