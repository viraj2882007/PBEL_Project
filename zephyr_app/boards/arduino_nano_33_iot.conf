# NOTE: this file is read by Zephyr as a Kconfig fragment for the board of the same name.
# It previously contained C preprocessor syntax, which is a Kconfig parse error and
# breaks `west build` for matching boards. The values below are documentation only;
# real peripheral selection comes from each board's devicetree.

# Zephyr board configuration for Arduino Nano 33 IoT (ATSAMD51J19)

# GPIO configuration
# GPIO_PORTS = "gpioa", "gpiob", "gpioc", "gpiod"

# ADC configuration
# ADC_CHANNELS = 16

# UART configuration - console on SERCOM0
# CONSOLE_UART = "uart0"

# SPI configuration
# SPI_BUS = "spi0"

# I2C configuration
# I2C_BUS = "i2c0"

# PWM configuration
# PWM_DEV = "pwm0"

# Counter/TIMER
# TIMER_DEV = "timer0"

# Flash
# FLASH_DEV = "flash0"

# Entropy/RNG
# ENTROPY_DEV = "rng"

# USB
# USB_DEV = "usb_dc"

# WiFi
# WIFI_DEV = "wifi0"
